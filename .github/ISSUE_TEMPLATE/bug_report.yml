name: Bug Report
description: Report a bug
labels: [bug]
body:
  - type: checkboxes
    id: search-check
    attributes:
      label: Before submitting
      options:
        - label: I have searched for existing issues
          required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to replicate
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: App version and build number (e.g. 1.0.0 18)
      placeholder: "1.0.0 18"
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      description: Found in Apple menu → About This Mac (e.g. MacBook Air M3)
      placeholder: "MacBook Air M3"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Found in Apple menu → About This Mac (e.g. 26.1)
      placeholder: "26.1"
    validations:
      required: true

  - type: input
    id: plex-server-version
    attributes:
      label: Plex Media Server version
      description: Found in Plex Web → Settings → General (e.g. 1.41.3.9314). Enter "N/A" if the bug is unrelated to a Plex server.
      placeholder: "1.41.3.9314"
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Any additional info
      placeholder: Any other context about the bug
