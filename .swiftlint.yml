# SwiftLint for Rivulet.
#
# Every stock rule is OFF. `only_rules: [custom_rules]` means SwiftLint runs as a
# regex engine for Rivulet's own architectural rules and nothing else. It has no
# opinion here about force casts, line length, or naming.
#
# The bar for adding a rule here: when it fires, the response is to fix the code,
# not to suppress the rule.

excluded:
  - RivuletCore/OpenSourceLicenses.swift   # license text, not code
  - RivuletCore/Config/Secrets.swift       # generated in CI

only_rules:
  - custom_rules

custom_rules:
  platform_conditional_in_shared_code:
    name: "#if os() in shared code"
    # RivuletCore holds the Plex and Live TV logic, kept apart from the Mac
    # views in RivuletMac. A platform branch in it means the code belongs in
    # RivuletMac, or the value should be injected by the app at launch.
    # Anchored to line start so comments may discuss the directive.
    included: ".*RivuletCore/.*"
    regex: "^\\s*#(if|elseif)[^\\n]*\\bos\\s*\\("
    message: "RivuletCore carries no platform conditionals. Move the platform-specific part into RivuletMac, or inject it from the app at launch (CLAUDE.md)."
    severity: error
